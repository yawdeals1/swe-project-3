# Service names matter here: Deploro's VPS deploy auto-detects a published HTTP port and
# prefers a service literally named app/web/server/api/backend (in that order) to become the
# public {slug}.deploro.app URL. Naming the Next.js service "web" (not "frontend") ensures it
# — not the raw API — is what the public URL routes to, keeping this a single-origin app: the
# browser only ever talks to "web", which proxies API calls server-side to "backend" over the
# internal docker network. That avoids CORS and cross-origin cookie/auth issues entirely.
#
# There is deliberately no "postgres" service here. This project's database is Deploro's own
# dedicated VPS Postgres (`deploro vps database create`), not a container in this stack — the
# VPS's shared port 5432 is already in use, and duplicating it here breaks `docker compose up`
# on deploy. Deploro injects DATABASE_URL_INTERNAL (and DATABASE_URL) into this stack's .env
# automatically once that database exists; the bare `- DATABASE_URL_INTERNAL` entries below pass
# those straight through only when present, so the backend's own EnvironmentPostProcessor can
# translate them from Deploro's postgres://user:pass@host/db form into a JDBC url. For local dev
# without a deployed VPS database, export DATABASE_URL_INTERNAL yourself before `docker compose
# up` (see README) — pointing at the same Deploro-hosted Postgres, or any Postgres you run.
#
# "backend" deliberately publishes no host port. "web" reaches it at http://backend:8080 over
# the internal docker network regardless — a published port is only for reaching a service
# directly from the host, and this VPS is shared across projects, so binding a common port like
# 8080 here collides with whatever else is already running there ("port is already allocated").
# For direct Postman/curl access during local dev, run `mvn spring-boot:run` outside Docker
# instead (binds :8080 on your own machine, no conflict).
#
# "web" publishes host port 39217 (mapped to its own internal :3000) instead of the default
# 3000 — every project on this shared VPS defaults to 3000 for its frontend, so that port is
# essentially guaranteed to already be taken by someone else's container. Deploro's VPS agent
# detects whatever port actually gets published and reverse-proxies {slug}.deploro.app to it,
# so the literal number here doesn't need to be "3000" or anything else specific — it only needs
# to not collide. If a future deploy ever fails again with "port is already allocated" on this
# number, that means something else grabbed it in the meantime; just pick a different one.
services:
  backend:
    build:
      context: ./backend
    environment:
      - DATABASE_URL_INTERNAL
      - DATABASE_URL
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL:-admin@carvo.local}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-changeme123}
      - PORT=8080

  web:
    build:
      context: ./frontend
    environment:
      # server-side only (Next.js Route Handlers proxy through this) — never exposed to the browser
      - BACKEND_INTERNAL_URL=http://backend:8080
      - PORT=3000
    depends_on:
      - backend
    ports:
      - "39217:3000"
