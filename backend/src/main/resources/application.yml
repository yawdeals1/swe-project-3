spring:
  application:
    name: carvo-api
  datasource:
    url: ${DATABASE_URL_INTERNAL:${DATABASE_URL:jdbc:postgresql://localhost:5432/carvo}}
    username: ${DATABASE_USER:carvo}
    password: ${DATABASE_PASSWORD:carvo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}

carvo:
  deploro:
    auth-base-url: ${DEPLORO_AUTH_BASE_URL:https://gallium-worker.calebmensah.workers.dev}
  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@carvo.local}
    seed-password: ${ADMIN_SEED_PASSWORD:}

logging:
  level:
    com.carvo.api: INFO
