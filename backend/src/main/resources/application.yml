spring:
  application:
    name: carvo-api
  datasource:
    url: ${DATABASE_URL_INTERNAL:${DATABASE_URL:jdbc:postgresql://localhost:5432/carvo}}
    username: ${DATABASE_USER:carvo}
    password: ${DATABASE_PASSWORD:carvo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

carvo:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    com.carvo.api: INFO
